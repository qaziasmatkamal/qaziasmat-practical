<body>
    <script>
function guess()
{
    let z = 7;
    let y = Number(document.getElementById("num").value);

    if(y == 7)
{
    alert("Congratulations! You guessed the correct number");
}
else if(y > 7)
{
    alert("Too High!")
}
else if(y < 7)
{
    alert("Too Low!")
}
}
function num()
{
        let z = 4;
    let y = Number(document.getElementById("num").value);

    if(y == 4)
{
    alert("Congratulations! You guessed the correct number");

else if(y > 4)
{
