<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
        div{
        margin: 0% auto;
        background-color: rgb(248, 227, 198);
        color: rgb(72, 42, 5);
      padding: 50px; width: 500px;
        text-align: center;
        align-items: center;
        margin-top: 150px;
    }
    input{
        padding: 15px;
        border: 3px solid rgb(72, 42, 5);
        color: rgb(72, 42, 5);
    }
</style>
<body>
    <script>
function add()
{
    let n1 = Number(document.getElementById("num1").value);
     let n2 = Number(document.getElementById("num2").value);

     let result = parseInt(n1) + parseInt(n2);
     document.getElementById("displayResult").innerHTML = result;
}
function sub()
{
     let n1 = Number(document.getElementById("num1").value);
      let n2 = Number(document.getElementById("num2").value);

      let result = n1 - n2;
      document.getElementById("displayResult").innerHTML = result;
}
function divide()
{
     let n1 = Number(document.getElementById("num1").value);
      let n2 = Number(document.getElementById("num2").value);

      let result = n1 / n2;
      document.getElementById("displayResult").innerHTML = result;
}
function multiply()
{
 let n1 = Number(document.getElementById("num1").value);
      let n2 = Number(document.getElementById("num2").value);

      let result = n1 * n2;
      document.getElementById("displayResult").innerHTML = result;
}
    </script>
    <div>
    <input type="number" id="num1" placeholder="Enter Your First Number">
    <br><br><br>
    <input type="number" id="num2" placeholder="Enter Your second Number">
    <br><br><br>


    <button onclick="add()">Add</button>
    <br><br>
    <button onclick="sub()">Subtract</button>
    <br><br>
    <button onclick="divide()">Divide</button>
    <br><br>
    <button onclick="multiply()">Multiply</button>

    <h3 id="displayResult"></h3>
    </div>
</body>
</html>
